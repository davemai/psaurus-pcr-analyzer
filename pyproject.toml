[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psaurus-pcr-analyzer"
version = "0.3.0"
description = "Quality filtering, flank-based insert extraction and quantification for Plasmidsaurus long-read (ONT) PCR amplicon data"
readme = "README.md"
# pandas 3.x / numpy 2.4 need >= 3.11; edlib ships Linux wheels up to cp313,
# so 3.11-3.13 is the tested range (see requirements.txt).
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Srivatsan Lab" }]
keywords = ["nanopore", "plasmidsaurus", "amplicon", "PCR", "bioinformatics"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "biopython>=1.79",   # FASTQ parsing + Phred decoding
  "edlib>=1.3.9",      # fast Levenshtein (infix/global) for fuzzy flank matching
  "pandas>=1.3",       # tabular outputs
  "numpy>=1.21",       # histogram binning in psaurus_pcr.plots
  "matplotlib>=3.4",   # QC plots and the PDF report
]

[project.optional-dependencies]
app = ["streamlit>=1.24"]
test = ["pytest>=7.0", "pypdf>=3.0"]
lint = ["pyflakes>=3.0"]
dev = ["streamlit>=1.24", "pytest>=7.0", "pypdf>=3.0", "pyflakes>=3.0"]

[project.scripts]
psaurus-pcr = "psaurus_pcr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
